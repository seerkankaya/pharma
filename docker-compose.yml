# Geliştirme için yerel PostgreSQL. Başlatmak için: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scalpiq
      POSTGRES_PASSWORD: scalpiq
      POSTGRES_DB: scalpiq
    ports:
      # Bilgisayarda 5432 başka bir veritabanınca kullanılıyorsa: PG_PORT=5434 docker compose up -d
      #   ve DATABASE_URL=postgres://scalpiq:scalpiq@127.0.0.1:5434/scalpiq
      - '127.0.0.1:${PG_PORT:-5432}:5432'
    volumes:
      - scalpiq_pharma_pg:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  scalpiq_pharma_pg:
