# Geliştirme için yerel PostgreSQL. Başlatmak için: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scalpiq
      POSTGRES_PASSWORD: scalpiq
      POSTGRES_DB: scalpiq
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
